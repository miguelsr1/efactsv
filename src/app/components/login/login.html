<div class="bg-surface-50 dark:bg-surface-950 px-6 py-20 md:px-20 lg:px-80">
  <div
    class="bg-surface-0 dark:bg-surface-900 p-8 md:p-12 shadow-sm rounded-2xl w-full max-w-sm mx-auto flex flex-col gap-8">
    <div class="flex flex-col items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="/images/user.webp" alt="Logo" class="w-16 h-16">
      </div>
      <div class="flex flex-col items-center gap-2 w-full">
        <div class="text-surface-900 dark:text-surface-0 text-2xl font-semibold leading-tight text-center w-full">
          eFacturame SV</div>
      </div>
    </div>
    <div class="flex flex-col gap-6 w-full">
      <div class="flex flex-col gap-2 w-full">
        <label for="email1" class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Usuario</label>
        <input pInputText id="email1" type="text" placeholder="usuario" [(ngModel)]="username" [disabled]="loading"
          class="w-full px-3 py-2 shadow-sm rounded-lg" />
      </div>
      <div class="flex flex-col gap-2 w-full">
        <label for="password1"
          class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Contraseña</label>
        <input pInputText id="password1" type="password" placeholder="********" [(ngModel)]="password"
          [disabled]="loading" (keyup.enter)="onLogin()" class="w-full px-3 py-2 shadow-sm rounded-lg" />
      </div>
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full gap-3 sm:gap-0">
        <div class="flex items-center gap-2">
          <p-checkbox id="rememberme1" [(ngModel)]="checked1" [binary]="true"></p-checkbox>
          <label for="rememberme1" class="text-surface-900 dark:text-surface-0 leading-normal">Recuerdame</label>
        </div>
        <a class="text-primary font-medium cursor-pointer hover:text-primary-emphasis">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
    <!-- Mensaje de error -->
    <div *ngIf="error"
      class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg">
      <p class="text-sm">{{ error }}</p>
    </div>

    <div class="flex flex-col gap-2 w-full">
      <div class="flex gap-3 w-full">
        <button pButton class="flex-1 py-2 rounded-lg flex justify-center items-center gap-2" (click)="onLogin()"
          [disabled]="loading">
          <i pButtonIcon [class]="loading ? 'pi pi-spin pi-spinner' : 'pi pi-user'"
            class="text-base! leading-normal!"></i>
          <span pButtonLabel>{{ loading ? 'Ingresando...' : 'Entrar' }}</span>
        </button>
        <button pButton class="flex-1 py-2 rounded-lg flex justify-center items-center gap-2" (click)="goToHome()"
          severity="secondary">
          <i pButtonIcon class="pi pi-sign-out text-base! leading-normal!"></i>
          <span pButtonLabel>Cancelar</span>
        </button>
      </div>
    </div>
  </div>
</div>
