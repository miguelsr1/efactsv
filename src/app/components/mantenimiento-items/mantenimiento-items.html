<div class="mantenimiento-items-container">
    <p-toast></p-toast>

    <!-- Header Card -->
    <div class="card bg-surface-0 dark:bg-surface-900 shadow-sm rounded-lg p-4 mb-4">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="pi pi-box text-surface-500 text-2xl"></i>
                <h2 class="text-2xl font-semibold text-surface-700 dark:text-surface-100 m-0">Mantenimiento de Items
                </h2>
            </div>
            <button pButton label="Nuevo Item" icon="pi pi-plus" class="p-button-success"
                (click)="showCreateDialog()"></button>
        </div>
    </div>

    <!-- Table Card -->
    <div class="card bg-surface-0 dark:bg-surface-900 shadow-sm rounded-lg p-4">
        <p-table [value]="items" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
            currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} items"
            [rowsPerPageOptions]="[10, 25, 50]" styleClass="p-datatable-sm" [loading]="loading"
            [globalFilterFields]="['nombre', 'codigoItem', 'codigoProducto']">

            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
                    <th pSortableColumn="codigoItem">Código Item <p-sortIcon field="codigoItem"></p-sortIcon></th>
                    <th pSortableColumn="codigoProducto">Código Producto <p-sortIcon
                            field="codigoProducto"></p-sortIcon></th>
                    <th>Código Unidad</th>
                    <th class="text-right">Precio Unitario</th>
                    <th>Estado</th>
                    <th>Exento</th>
                    <th>Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-item>
                <tr>
                    <td>{{ item.nombre }}</td>
                    <td><span class="font-mono font-semibold">{{ item.codigoItem }}</span></td>
                    <td><span class="font-mono">{{ item.codigoProducto }}</span></td>
                    <td>{{ item.codigoUnidad }}</td>
                    <td class="text-right">${{ item.precioUnitario | number:'1.2-2' }}</td>
                    <td>
                        <p-tag [value]="item.activo ? 'Activo' : 'Inactivo'"
                            [severity]="item.activo ? 'success' : 'danger'"></p-tag>
                    </td>
                    <td class="text-center">
                        <i
                            [class]="item.exento ? 'pi pi-check-circle text-green-500' : 'pi pi-times-circle text-red-500'"></i>
                    </td>
                    <td>
                        <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-info"
                            pTooltip="Editar" (click)="showEditDialog(item)"></button>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="8" class="text-center p-4">
                        No se encontraron items.
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <!-- Form Dialog -->
    <p-dialog [header]="isEditMode ? 'Editar Item' : 'Nuevo Item'" [(visible)]="displayDialog" [modal]="true"
        [style]="{width: '600px'}" [draggable]="false" [resizable]="false" (onHide)="cancelEdit()">

        <div class="grid formgrid p-fluid">
            <!-- Nombre -->
            <div class="field col-12">
                <label for="nombre" class="font-semibold">Nombre <span class="text-red-500">*</span></label>
                <input pInputText id="nombre" [(ngModel)]="currentItem.nombre" placeholder="Nombre del item"
                    class="w-full" />
            </div>

            <!-- Código Item y Código Producto -->
            <div class="field col-12 md:col-6">
                <label for="codigoItem" class="font-semibold">Código Item <span class="text-red-500">*</span></label>
                <input pInputText id="codigoItem" [(ngModel)]="currentItem.codigoItem" placeholder="Máx. 2 caracteres"
                    maxlength="2" class="w-full" />
            </div>

            <div class="field col-12 md:col-6">
                <label for="codigoProducto" class="font-semibold">Código Producto <span
                        class="text-red-500">*</span></label>
                <input pInputText id="codigoProducto" [(ngModel)]="currentItem.codigoProducto"
                    placeholder="Código de producto" class="w-full" />
            </div>

            <!-- Código Unidad y Precio -->
            <div class="field col-12 md:col-6">
                <label for="codigoUnidad" class="font-semibold">Código Unidad <span
                        class="text-red-500">*</span></label>
                <input pInputText id="codigoUnidad" [(ngModel)]="currentItem.codigoUnidad"
                    placeholder="Código de unidad" class="w-full" />
            </div>

            <div class="field col-12 md:col-6">
                <label for="precioUnitario" class="font-semibold">Precio Unitario <span
                        class="text-red-500">*</span></label>
                <p-inputNumber id="precioUnitario" [(ngModel)]="currentItem.precioUnitario" mode="currency"
                    currency="USD" locale="en-US" [minFractionDigits]="2" [maxFractionDigits]="2" class="w-full">
                </p-inputNumber>
            </div>

            <!-- Checkboxes -->
            <div class="field col-12 md:col-6">
                <div class="flex items-center gap-2">
                    <p-checkbox [(ngModel)]="currentItem.activo" [binary]="true" inputId="activo"></p-checkbox>
                    <label for="activo" class="font-semibold cursor-pointer">Activo</label>
                </div>
            </div>

            <div class="field col-12 md:col-6">
                <div class="flex items-center gap-2">
                    <p-checkbox [(ngModel)]="currentItem.exento" [binary]="true" inputId="exento"></p-checkbox>
                    <label for="exento" class="font-semibold cursor-pointer">Exento</label>
                </div>
            </div>
        </div>

        <ng-template pTemplate="footer">
            <div class="flex justify-end gap-2">
                <button pButton label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="cancelEdit()"
                    [disabled]="saving"></button>
                <button pButton [label]="isEditMode ? 'Actualizar' : 'Crear'" icon="pi pi-check"
                    class="p-button-primary" (click)="saveItem()" [disabled]="saving" [loading]="saving"></button>
            </div>
        </ng-template>
    </p-dialog>
</div>
