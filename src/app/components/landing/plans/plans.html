<div class="bg-surface-50 dark:bg-surface-950 px-6 py-20 md:px-12 lg:px-20">
  <div class="flex flex-col gap-4 items-center justify-center mb-12">
    <div class="text-surface-900 dark:text-surface-0 font-bold text-4xl lg:text-5xl text-center leading-tight">Planes
    </div>
    <div class="text-surface-500 dark:text-surface-400 text-lg text-center leading-normal">Escala según tu volumen. Todos los planes incluyen pruebas en Hacienda y soporte básico
    </div>
  </div>

  <div class="flex lg:flex-row flex-col gap-8 max-w-7xl mx-auto">
    <ng-container *ngFor="let p of plans">
      <div class="w-full flex-1 p-8 flex rounded-2xl flex-col bg-surface-0 dark:bg-surface-800 shadow-sm gap-6">
        <div class="flex flex-col gap-2">
          <h4 class="text-surface-900 dark:text-surface-0 font-medium text-xl leading-tight">{{ p.size }}</h4>
          <p class="text-surface-500 dark:text-surface-400 leading-normal"></p>
        </div>

        <div class="w-full h-px bg-surface-200 dark:bg-surface-700"></div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-3xl text-surface-900 dark:text-surface-0 leading-tight">${{ p.price }}</span>
          <span class="font-medium text-surface-500 dark:text-surface-400 leading-tight">por mes</span>
        </div>
        <div class="w-full h-px bg-surface-200 dark:bg-surface-600"></div>
        <ul class="list-none flex flex-col gap-4 flex-1">
          <li class="flex items-center gap-2">
            <i class="pi pi-check-circle text-lg! text-green-500"></i>
            <span class="text-surface-800 dark:text-surface-100 leading-tight"> {{ p.featureA }} </span>
          </li>
          <li class="flex items-center gap-2">
            <i class="pi pi-check-circle text-lg! text-green-500"></i>
            <span class="text-surface-800 dark:text-surface-100 leading-tight"> {{ p.featureB }} </span>
          </li>
        </ul>
      </div>
    </ng-container>
  </div>
</div>
